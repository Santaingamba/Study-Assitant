services:
  - type: web
    name: study-assistant
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build
    startCommand: NODE_ENV=production npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: ALLOW_MOCK
        value: "0"
      - key: IDLE_MS
        value: "20000"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
